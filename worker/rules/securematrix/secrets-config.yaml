# SecureMatrix bundled Semgrep rules: secrets and configuration files (language-agnostic)
rules:
  - id: sm-secret-aws-access-key
    languages: [generic]
    severity: ERROR
    message: An AWS access key ID is committed to the repository. Revoke it in IAM, then load credentials from the environment or an IAM role.
    pattern-regex: \b(AKIA|ASIA)[0-9A-Z]{16}\b
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      category: security
      securematrix_severity: critical

  - id: sm-secret-private-key
    languages: [generic]
    severity: ERROR
    message: A private key is committed to the repository. Treat it as compromised, rotate it and store keys in a secrets manager.
    pattern-regex: -----BEGIN (RSA |EC |DSA |OPENSSH |ENCRYPTED )?PRIVATE KEY-----
    metadata:
      cwe: ["CWE-321: Use of Hard-coded Cryptographic Key"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      category: security
      securematrix_severity: critical

  - id: sm-secret-provider-token
    languages: [generic]
    severity: ERROR
    message: A token for a third-party service (Stripe, GitHub, Slack, Google, OpenAI) appears in the code. Revoke it and move it to a secrets store.
    pattern-regex: \b(sk_live_[0-9A-Za-z]{16,}|gh[pousr]_[0-9A-Za-z]{30,}|xox[baprs]-[0-9A-Za-z-]{20,}|AIza[0-9A-Za-z_\-]{35}|sk-(proj-)?[A-Za-z0-9_\-]{32,})
    metadata:
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      category: security

  - id: sm-config-plaintext-password
    languages: [generic]
    severity: WARNING
    message: A password is stored in plain text in a configuration file. Reference an environment variable or secrets manager instead.
    paths:
      include: ["*.env", ".env*", "*.yml", "*.yaml", "*.properties", "*.ini", "*.cfg", "*.conf", "*.toml"]
    pattern-regex: (?im)^\s*[\w.]*(password|passwd|pwd|secret)[\w.]*\s*[:=]\s*["']?(?!\$\{)(?!changeme)[^\s"'#$]{6,}
    metadata:
      cwe: ["CWE-256: Plaintext Storage of a Password"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      category: security

  - id: sm-config-debug-enabled
    languages: [generic]
    severity: WARNING
    message: Debug mode is enabled in configuration. Debug pages leak stack traces, settings and sometimes allow code execution.
    paths:
      include: ["*.env", ".env*", "settings.py", "*.yml", "*.yaml", "*.properties", "*.ini", "*.cfg"]
    pattern-regex: (?im)^\s*(DEBUG|APP_DEBUG|FLASK_DEBUG)\s*[:=]\s*["']?(true|1|on|yes)["']?\s*$
    metadata:
      cwe: ["CWE-489: Active Debug Code"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      category: security

  - id: sm-docker-runs-as-root
    languages: [dockerfile]
    severity: WARNING
    message: The container explicitly runs as root. A compromise of the application then has root inside the container. Add a non-root USER.
    pattern: USER root
    metadata:
      cwe: ["CWE-250: Execution with Unnecessary Privileges"]
      owasp: ["A05:2021 - Security Misconfiguration"]
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      category: security

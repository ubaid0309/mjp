# Runs the SecureMatrix worker (scan pipeline + RAG API). Supabase itself is hosted (supabase.com)
# or started separately with `npx supabase start`.
services:
  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
      args:
        LOCAL_EMBEDDINGS: "false"
    env_file: worker/.env
    ports:
      - "8787:8787"
    restart: unless-stopped

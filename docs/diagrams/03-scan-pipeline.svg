<text x="280" y="343.24" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">Archive safe?</text>
<text x="280" y="360.24" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">no absolute paths, '..',</text>
<text x="280" y="377.24" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">symlinks, encryption,</text>
<text x="280" y="394.24" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">zip bombs, size limits</text>

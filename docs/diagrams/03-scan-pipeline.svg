<text x="1185.0" y="76.74" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Normalise results</text>
<text x="1185.0" y="94.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">CWE / OWASP mapping, severity,</text>
<text x="1185.0" y="111.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">confidence, redacted snippet</text>
<rect x="1030" y="140" width="310" height="70" rx="6" fill="#EEF4FB" stroke="#2F5D8A" stroke-width="1.4"/>
<text x="1185.0" y="161.74" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Deduplicate</text>
<text x="1185.0" y="179.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">same file + line + CWE across rules;</text>
<text x="1185.0" y="196.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">line-independent fingerprint</text>
<rect x="1030" y="225" width="310" height="70" rx="6" fill="#EEF4FB" stroke="#2F5D8A" stroke-width="1.4"/>
<text x="1185.0" y="246.74" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Retrieve knowledge per finding</text>
<text x="1185.0" y="264.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">exact CWE match +</text>
<text x="1185.0" y="281.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">pgvector cosine similarity</text>
<rect x="1030" y="310" width="310" height="70" rx="6" fill="#EEF4FB" stroke="#2F5D8A" stroke-width="1.4"/>
<text x="1185.0" y="331.74" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Risk score 0-100</text>
<text x="1185.0" y="349.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">severity x exploitability</text>
<text x="1185.0" y="366.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">x exposure x confidence</text>
<rect x="1030" y="395" width="310" height="70" rx="6" fill="#EEF4FB" stroke="#2F5D8A" stroke-width="1.4"/>
<text x="1185.0" y="425.24" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Upsert findings</text>
<text x="1185.0" y="443.24" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">new / existing / reopened</text>

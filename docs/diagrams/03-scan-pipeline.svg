<rect x="70" y="535" width="330" height="76" rx="6" fill="#EEF4FB" stroke="#2F5D8A" stroke-width="1.4"/>
<text x="235.0" y="559.74" font-size="14" font-weight="bold" text-anchor="middle" fill="#14202E">Record exclusions</text>
<text x="235.0" y="577.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">dependencies, build output, lock files,</text>
<text x="235.0" y="594.74" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#14202E">binaries, oversized, unsupported</text>
